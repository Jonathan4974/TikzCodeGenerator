description: DeTikZify image similarity eval

prompts:
  - "{{input_image}}"

providers:
  - id: http
    label: detikzify-api
    config:
      url: http://host.docker.internal:8000/detikzify
      method: POST
      multipart:
        parts:
          - kind: file
            name: image
            filename: input.png
            contentType: image/png
            source:
              type: path
              path: "file://{{input_image}}"

          - kind: field
            name: timeout
            value: "{{timeout}}"

      transformResponse: json.tikz

defaultTest:
  vars:
    timeout: 60
    crystalbleu_k: 500
    lpips_net_type: alex
    
    similarity_threshold: 0.75
    crystalbleu_threshold: 0.1
    ted_threshold: 500
    clip_threshold: 0.60
    siglip_threshold: 0.60
    lpips_threshold: 0.30
    dists_threshold: 0.25

  assert:
    - type: python
      value: file://assertions/image_structural_similarity.py
      metric: image_ssim

    - type: python
      value: file://assertions/tikz_is_renderable.py
      metric: renderable

    - type: python
      value: file://assertions/tikz_crystalbleu.py
      metric: crystalbleu

    - type: python
      value: file://assertions/tikz_ted.py
      metric: ted_similarity

    - type: python
      value: file://assertions/image_clip_similarity.py
      metric: clip_similarity

    - type: python
      value: file://assertions/image_siglip_similarity.py
      metric: siglip_similarity

    - type: python
      value: file://assertions/image_lpips.py
      metric: lpips_distance
    
    - type: python
      value: file://assertions/image_dists.py
      metric: dists_distance

tests:
  - vars:
      input_image: /images/train-00000_row_00000000.png
      reference_text: /references/train-00000_row_00000000.txt

  - vars:
      input_image: /images/train-00000_row_00000001.png
      reference_text: /references/train-00000_row_00000001.txt

  - vars:
      input_image: /images/train-00000_row_00000002.png
      reference_text: /references/train-00000_row_00000002.txt

  - vars:
      input_image: /images/train-00000_row_00000003.png
      reference_text: /references/train-00000_row_00000003.txt