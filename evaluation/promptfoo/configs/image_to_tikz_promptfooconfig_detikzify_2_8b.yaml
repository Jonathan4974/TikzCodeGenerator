description: image to tikz code using detikzify-2-8b

prompts:
  - "{{input_image}}"

  - id: http
    label: detikzify-2-8b
    config:
      url: http://host.docker.internal:8001/detikzify
      method: POST
      multipart:
        parts:
          - kind: file
            name: image
            filename: input.png
            contentType: image/png
            source:
              type: path
              path: "file://{{input_image}}"

          - kind: field
            name: timeout
            value: "{{timeout}}"

      transformResponse: json.tikz

defaultTest:
  vars:
    debug: true

    timeout: 6
    crystalbleu_k: 500
    crystalbleu_n: 1
    lpips_net_type: alex
    crystalbleu_use_cache: true

  assert:
    - type: python
      value: file:///app/assertions/image_structural_similarity.py
      metric: image_ssim
      config:
        threshold: 0.75

    - type: python
      value: file:///app/assertions/tikz_is_renderable.py
      metric: renderable

    - type: python
      value: file:///app/assertions/tikz_crystalbleu.py
      metric: crystalbleu
      config:
        threshold: 0.1

    - type: python
      value: file:///app/assertions/tikz_crystalbleu_from_scitikzer.py
      metric: crystalbleu_scitikzer
      config:
        threshold: 0.1

    - type: python
      value: file:///app/assertions/tikz_ted.py
      metric: ted_similarity
      config:
        threshold: 0.5

    - type: python
      value: file:///app/assertions/tikz_ted_from_scitikzer.py
      metric: ted_similarity_scitikzer
      config:
        threshold: 0.5

    - type: python
      value: file:///app/assertions/image_clip_similarity.py
      metric: clip_similarity
      config:
        threshold: 0.6

    - type: python
      value: file:///app/assertions/image_siglip_similarity.py
      metric: siglip_similarity
      config:
        threshold: 0.6

    - type: python
      value: file:///app/assertions/image_siglip_cc.py
      metric: siglip_cc
      config:
        threshold: 0.7

    - type: python
      value: file:///app/assertions/image_lpips.py
      metric: lpips_similarity
      config:
        threshold: 0.8

    - type: python
      value: file:///app/assertions/image_dreamsim.py
      metric: dreamsim_similarity
      config:
        threshold: 0.75

    - type: python
      value: file:///app/assertions/image_dists.py
      metric: dists_distance
      config:
        threshold: 0.8

    - type: python
      value: file:///app/assertions/tikz_relative_length_output_reference.py
      metric: relative_length_error
      config:
        threshold: 0.8

    - type: python
      value: file:///app/assertions/image_ms_structual_similarity.py
      metric: ms-ssim
      config:
        threshold: 0.75

tests:
  - vars:
      input_image: /images/train-00000_row_00000000.png
      reference_text: /references/train-00000_row_00000000.txt

  - vars:
      input_image: /images/train-00000_row_00000001.png
      reference_text: /references/train-00000_row_00000001.txt

  - vars:
      input_image: /images/train-00000_row_00000002.png
      reference_text: /references/train-00000_row_00000002.txt

  - vars:
      input_image: /images/train-00000_row_00000003.png
      reference_text: /references/train-00000_row_00000003.txt