- id: http
  label: "gemma4:31b-it-q4_K_M"
  config:
    url: "http://127.0.0.1:8444/generate"
    method: POST
    timeout: 900000
    validateStatus: "status >= 200 && status < 300"
    transformResponse: "text"
    multipart:
      parts:
        - kind: file
          name: image
          filename: input.png
          contentType: image/png
          source:
            type: path
            path: "{{reference_image}}"

        - kind: file
          name: llm_description
          filename: description.txt
          contentType: text/plain
          source:
            type: path
            path: "{{llm_description}}"

        - kind: field
          name: prompt
          value: "{{prompt}}"

        - kind: field
          name: use_llm_description
          value: "false"

        - kind: field
          name: debug
          value: "true"

        - kind: field
          name: model
          value: "gemma4:31b-it-q4_K_M"

        - kind: field
          name: think
          value: "true"

        - kind: field
          name: num_predict
          value: "8192"

        - kind: field
          name: num_ctx
          value: "16384"

        - kind: field
          name: thinking_token_multiplier
          value: "2"

