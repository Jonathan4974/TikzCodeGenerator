description: image to tikz code using geotikzbridge-instruct-8b

prompts:
  - |
    As a LaTeX graphics expert, translate the image into TikZ code suitable for academic publications. 
    Focus on recreating geometric precision, typographic elements, and color schemes. 
    The code must be compilable, efficient, and maintain the original image's visual fidelity for professional document integration.
    Return only the full LaTeX document.
    Do not use markdown fences.
    Do not add explanations.

providers:
  - id: http
    label: geotikzbridge-instruct-8b
    config:
      url: http://host.docker.internal:8007/geotikzbridge
      method: POST
      multipart:
        parts:
          - kind: file
            name: image
            filename: input.png
            contentType: image/png
            source:
              type: path
              path: "file://{{reference_image}}"

          - kind: field
            name: prompt
            value: "{{prompt}}"

      transformResponse: json.tikz
      
defaultTest:
  vars:
    debug: true

    timeout: 60
    crystalbleu_k: 500
    crystalbleu_n: 4
    lpips_net_type: alex
    crystalbleu_use_cache: true

  assert:
    - type: python
      value: file:///app/assertions/image_structural_similarity.py
      metric: image_ssim
      config:
        threshold: 0.75

    - type: python
      value: file:///app/assertions/tikz_is_renderable.py
      metric: renderable

    - type: python
      value: file:///app/assertions/tikz_crystalbleu.py
      metric: crystalbleu
      config:
        threshold: 0.1
        crystalbleu_corpus: /crystalbleu_corpus

    - type: python
      value: file:///app/assertions/tikz_ted.py
      metric: ted_similarity
      config:
        threshold: 0.5

    - type: python
      value: file:///app/assertions/image_clip_similarity.py
      metric: clip_similarity
      config:
        threshold: 0.6

    - type: python
      value: file:///app/assertions/image_siglip_similarity.py
      metric: siglip_similarity
      config:
        threshold: 0.6

    - type: python
      value: file:///app/assertions/image_lpips.py
      metric: lpips_similarity
      config:
        threshold: 0.8

    - type: python
      value: file:///app/assertions/image_dreamsim.py
      metric: dreamsim_similarity
      config:
        threshold: 0.75

    - type: python
      value: file:///app/assertions/image_dists.py
      metric: dists_distance
      config:
        threshold: 0.8

    - type: python
      value: file:///app/assertions/tikz_relative_length_output_reference.py
      metric: relative_length_error
      config:
        threshold: 0.8

    - type: python
      value: file:///app/assertions/image_ms_structual_similarity.py
      metric: ms-ssim
      config:
        threshold: 0.75

tests: file:///image_manifest.csv